name: Release macOS binaries

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_arch: x86_64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target "$TARGET"
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify release version
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          release_version="$(tr -d '\r\n' < VERSION)"
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "mac-dir-stat"))')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$release_version" ]]; then
            echo "Tag version $tag_version does not match VERSION $release_version" >&2
            exit 1
          fi
          if [[ "$release_version" != "$manifest_version" ]]; then
            echo "VERSION $release_version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --target "$TARGET" --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$TARGET"

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          package_name="macDirStat-${GITHUB_REF_NAME}-macos-${ASSET_ARCH}"
          mkdir -p "dist/$package_name"
          install -m 755 "target/$TARGET/release/macDirStat" "dist/$package_name/macDirStat"
          cp README.md "dist/$package_name/README.md"
          cp VERSION "dist/$package_name/VERSION"
          tar -C dist -czf "dist/${package_name}.tar.gz" "$package_name"
          (
            cd dist
            shasum -a 256 "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256"
          )

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.tar.gz \
            release-assets/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "macDirStat $GITHUB_REF_NAME"
