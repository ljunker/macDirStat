[package]
name = "mac-dir-stat"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"
description = "A responsive macOS terminal disk usage explorer"
default-run = "macDirStat"

[[bin]]
name = "macDirStat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
directories = "6.0"
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = "1.1"
thiserror = "2.0"
toml = "1.1"
trash = "5.2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.27"
